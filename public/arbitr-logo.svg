<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <defs>
    <!-- Cyan-Blue Neon Glow Gradients -->
    <linearGradient id="arbitrNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Scaled Emblem at Center Top (centered around x=250, y=105) -->
  <g filter="url(#logoGlow)" stroke="url(#arbitrNeon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(150, 5) scale(1)">
    <!-- Central Upward Arrow -->
    <path d="M 100 24 L 82 56 L 93 52 L 93 68 M 100 24 L 118 56 L 107 52 L 107 68" />
    <polygon points="100,26 84,54 94,51 94,66 106,66 106,51 116,54" fill="url(#arbitrNeon)" fill-opacity="0.2" />

    <!-- Outer Circular Boundary Arcs -->
    <path d="M 80 44 A 56 56 0 0 0 52 70" />
    <path d="M 120 44 A 56 56 0 0 1 148 70" />
    <path d="M 48 78 A 56 56 0 0 0 78 132" />
    <path d="M 152 78 A 56 56 0 0 1 122 132" />

    <!-- Left Scale (Pan of Justice) -->
    <path d="M 64 72 L 44 106" />
    <path d="M 64 72 L 76 106" />
    <path d="M 42 106 L 78 106" />
    <path d="M 44 106 Q 60 124 76 106 Z" fill="url(#arbitrNeon)" fill-opacity="0.15" />

    <!-- Right Scale (Pan of Justice) -->
    <path d="M 136 72 L 124 106" />
    <path d="M 136 72 L 156 106" />
    <path d="M 122 106 L 158 106" />
    <path d="M 124 106 Q 140 124 156 106 Z" fill="url(#arbitrNeon)" fill-opacity="0.15" />

    <!-- Intertwining Converging Ribbons -->
    <path d="M 74 148 C 90 148 94 133 95 116 C 96 98 95 78 95 68" />
    <path d="M 126 148 C 110 148 106 133 105 116 C 104 98 105 78 105 68" />
    
    <!-- Ribbon tails -->
    <path d="M 74 148 C 66 148 58 151 52 154" />
    <path d="M 126 148 C 134 148 142 151 148 154" />
  </g>

  <!-- Typography: Modern Geometric "ARBITR" -->
  <g filter="url(#textGlow)">
    <!-- Letter A with stylized diagonal slash -->
    <g transform="translate(68, 205)">
      <!-- Left leg broken / angled -->
      <path d="M 10 60 L 32 8" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" />
      <!-- Right leg -->
      <path d="M 32 8 L 54 60" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" />
      <!-- Signature Angled Crossbar -->
      <path d="M 0 54 L 28 36" stroke="url(#textGrad)" stroke-width="6.5" stroke-linecap="round" />
    </g>

    <!-- Letter R -->
    <g transform="translate(136, 205)">
      <path d="M 8 60 L 8 8 L 32 8 C 44 8 48 18 48 26 C 48 35 42 42 30 42 L 8 42 M 28 42 L 48 60" 
            stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Letter B -->
    <g transform="translate(202, 205)">
      <path d="M 8 60 L 8 8 L 30 8 C 40 8 44 14 44 22 C 44 30 38 34 28 34 L 8 34 M 28 34 C 40 34 46 39 46 47 C 46 56 40 60 28 60 L 8 60" 
            stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Letter I -->
    <g transform="translate(272, 205)">
      <path d="M 8 8 L 8 60" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" />
    </g>

    <!-- Letter T -->
    <g transform="translate(300, 205)">
      <path d="M 2 8 L 50 8 M 26 8 L 26 60" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" />
    </g>

    <!-- Letter R -->
    <g transform="translate(366, 205)">
      <path d="M 8 60 L 8 8 L 32 8 C 44 8 48 18 48 26 C 48 35 42 42 30 42 L 8 42 M 28 42 L 48 60" 
            stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
