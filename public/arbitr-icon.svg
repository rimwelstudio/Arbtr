<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Cyan-Blue Neon Glow Gradients -->
    <linearGradient id="arbitrCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="arbitrDeepGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft outer glow filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonBlur)" stroke="url(#arbitrCyanGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Central Arrow Head -->
    <path d="M 100 32 L 84 62 L 94 58 L 94 72 M 100 32 L 116 62 L 106 58 L 106 72" fill="none" />
    <polygon points="100,34 86,60 95,57 95,70 105,70 105,57 114,60" fill="url(#arbitrCyanGlow)" fill-opacity="0.15" />

    <!-- Outer Circular Boundary Arcs (framing the scales) -->
    <!-- Left upper arc from near arrow to left beam -->
    <path d="M 82 50 A 54 54 0 0 0 54 75" />
    <!-- Right upper arc from near arrow to right beam -->
    <path d="M 118 50 A 54 54 0 0 1 146 75" />
    <!-- Bottom outer guidance arcs -->
    <path d="M 52 82 A 54 54 0 0 0 80 134" />
    <path d="M 148 82 A 54 54 0 0 1 120 134" />

    <!-- Left Scale of Justice (Pan) -->
    <!-- Suspension cords from beam point (64, 76) -->
    <path d="M 64 76 L 46 108" />
    <path d="M 64 76 L 76 108" />
    <!-- Left Scale Horizontal Rim -->
    <path d="M 44 108 L 78 108" />
    <!-- Left Scale Bowl (Curved Basin) -->
    <path d="M 46 108 Q 61 124 76 108 Z" fill="url(#arbitrCyanGlow)" fill-opacity="0.12" />

    <!-- Right Scale of Justice (Pan) -->
    <!-- Suspension cords from beam point (136, 76) -->
    <path d="M 136 76 L 124 108" />
    <path d="M 136 76 L 154 108" />
    <!-- Right Scale Horizontal Rim -->
    <path d="M 122 108 L 156 108" />
    <!-- Right Scale Bowl (Curved Basin) -->
    <path d="M 124 108 Q 139 124 154 108 Z" fill="url(#arbitrCyanGlow)" fill-opacity="0.12" />

    <!-- Dynamic Intertwining Flow Paths (Converging into the central arrow) -->
    <!-- Path 1: From lower-left swooping through center up to arrow stem -->
    <path d="M 76 150 C 90 150 94 135 95 118 C 96 102 96 82 96 70" />
    <!-- Path 2: From lower-right swooping through center up to arrow stem -->
    <path d="M 124 150 C 110 150 106 135 105 118 C 104 102 104 82 104 70" />
    
    <!-- Dynamic bottom flare tails -->
    <path d="M 76 150 C 70 150 64 152 58 155" />
    <path d="M 124 150 C 130 150 136 152 142 155" />
  </g>
</svg>
