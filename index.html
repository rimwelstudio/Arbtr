    <script>
      (function() {
        // Global PWA prompt capture so install events before React mount are never missed
        window.__pwaDeferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__pwaDeferredPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__pwaDeferredPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });

        // Prevent Vite HMR WebSocket connection failure in sandboxed preview iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var target = new EventTarget();
              target.readyState = 1; // OPEN
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (_) {}
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }

          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        // Global safeguard against unhandled WebSocket rejections
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || e.error)) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
      })();
    </script>
